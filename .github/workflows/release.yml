name: Release

on: [workflow_dispatch]

jobs:
  test:
    name: "Test on Python ${{ matrix.python-version }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          # tested via conda in test_windows_conda
          - os: windows-latest
            python-version: "3.15"
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - uses: "actions/setup-python@v7"
        with:
            python-version: "${{ matrix.python-version }}"

      # h5py has no 3.15 wheels on PyPI, so pip builds it against a system HDF5
      - name: Install HDF5 (Linux)
        if: matrix.python-version == '3.15' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - name: Install HDF5 (macOS)
        if: matrix.python-version == '3.15' && runner.os == 'macOS'
        run: |
          brew install hdf5 pkgconf

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: "Run nox for ${{ matrix.python-version }}"
        run: uv run --group dev nox --force-python python -s test

  # h5py has no 3.15 wheels on PyPI and building it on Windows needs a patched
  # HDF5, so this job takes h5py from conda-forge and runs pytest without nox.
  test_windows_conda:
    name: "Test on Python 3.15 (windows-latest, conda)"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: "3.15"
          activate-environment: test

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          conda install --yes "h5py>=3.16.0"
          uv pip install --python python -e . --group dev

      - name: Run pytest
        run: python -m pytest -s -x .

  build:
    name: Build wheel and sdist
    needs: [test, test_windows_conda]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload sdist and wheel
        uses: actions/upload-artifact@v7
        with:
          name: c3h5-wheel-sdist
          path: |
            ./dist/*.whl
            ./dist/*.tar.gz
  
  release_test:
    name: Release to Test PyPI
    needs: [build]
    environment: release_test
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdist and wheel
        uses: actions/download-artifact@v8
        with:
          name: c3h5-wheel-sdist
          path: ./dist

      - name: Publish package distributions to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  
  release:
    name: Release to PyPI
    needs: release_test
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdist and wheel
        uses: actions/download-artifact@v8
        with:
          name: c3h5-wheel-sdist
          path: ./dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1